name: Deploy
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: {contents: read, packages: write}
concurrency: {group: deploy, cancel-in-progress: false}
jobs:
  build:
    # Faqat CI muvaffaqiyatli o'tgan bo'lsa (yoki qo'lda ishga tushirilsa)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.workflow_run.head_sha || github.sha }}"}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
        env: {GITHUB_SHA: "${{ github.event.workflow_run.head_sha || github.sha }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.workflow_run.head_sha || github.sha }}"}
      - name: Compose va nginx fayllarini serverga yuborish
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/,scripts/"
          target: ${{ secrets.DEPLOY_PATH || '/opt/markaz' }}
      - name: Yangi versiyani ishga tushirish
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE,GH_USER,GH_TOKEN
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/markaz' }}
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
            export IMAGE
            echo "IMAGE=$IMAGE" > .image.env
            docker compose -f docker-compose.prod.yml pull web
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:${WEB_PORT:-8001}/healthz/ >/dev/null; then echo "Sog'lom ✔ $IMAGE"; docker image prune -f >/dev/null; exit 0; fi
              sleep 3
            done
            echo "Healthcheck muvaffaqiyatsiz — loglar:"; docker compose -f docker-compose.prod.yml logs --tail=60 web
            exit 1
