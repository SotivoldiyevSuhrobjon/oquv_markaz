limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://web:8000;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://web:8000;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location /healthz/ { proxy_pass http://web:8000; include /etc/nginx/conf.d/proxy.inc; }
    location /static/ { proxy_pass http://web:8000; include /etc/nginx/conf.d/proxy.inc; }
    location / { proxy_pass http://web:8000; include /etc/nginx/conf.d/proxy.inc; }
}
