# Serverdagi mavjud nginx uchun: /etc/nginx/sites-available/markaz  (so'ng sites-enabled ga ulang)
# TLS:  sudo certbot --nginx -d SIZNING-DOMEN
limit_req_zone $binary_remote_addr zone=markaz_login:10m rate=5r/m;

server {
    listen 80;
    server_name SIZNING-DOMEN;
    client_max_body_size 2m;
    server_tokens off;

    location = /api/auth/login/ {
        limit_req zone=markaz_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
